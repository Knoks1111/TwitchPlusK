name: 🔧 Build Dylib TwitchPlusK

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths: ['**.m', '**.h', '**.c', 'Makefile']

env:
  THEOS: ${{ github.workspace }}/theos

permissions:
  contents: write

jobs:
  build-dylib:
    runs-on: macos-14

    steps:

      - name: 📥 Checkout tweak code
        uses: actions/checkout@v5

      - name: 💾 Cache Theos
        id: cache-theos
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/theos
          key: theos-ios-${{ runner.os }}-v8

      - name: 🔧 Install Theos + iOS SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "📦 Cloning Theos..."
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

          echo "🔍 Looking up SDK via GitHub API (authenticated)..."

          cat > /tmp/find_sdk.py << 'PYEOF'
          import sys, json
          try:
              data = json.load(sys.stdin)
              assets = data.get('assets', [])
              prefs = ['iPhoneOS17.5', 'iPhoneOS17.2', 'iPhoneOS17.0',
                       'iPhoneOS16.5', 'iPhoneOS16.4', 'iPhoneOS16',
                       'iPhoneOS15.5', 'iPhoneOS']
              for pref in prefs:
                  for a in assets:
                      name = a.get('name', '')
                      if pref in name and name.endswith('.tar.xz'):
                          print(a['browser_download_url'])
                          sys.exit(0)
              print('', file=sys.stderr)
              print('Available assets:', file=sys.stderr)
              for a in assets:
                  print(' -', a.get('name', '?'), file=sys.stderr)
          except Exception as e:
              print(f'Error: {e}', file=sys.stderr)
          print('')
          PYEOF

          API_RESPONSE=$(curl --silent --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/theos/sdks/releases/latest")

          echo "📋 Release name: $(echo "$API_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('name','?'))" 2>/dev/null || echo '?')"

          API_URL=$(echo "$API_RESPONSE" | python3 /tmp/find_sdk.py 2>&1 | head -1)
          echo "🔗 API URL: ${API_URL:-(empty)}"

          FALLBACK_URLS=(
            "https://github.com/theos/sdks/releases/latest/download/iPhoneOS17.5.sdk.tar.xz"
            "https://github.com/theos/sdks/releases/latest/download/iPhoneOS17.2.sdk.tar.xz"
            "https://github.com/theos/sdks/releases/latest/download/iPhoneOS17.0.sdk.tar.xz"
            "https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz"
            "https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.4.sdk.tar.xz"
          )

          ALL_URLS=()
          if [ -n "$API_URL" ] && [[ "$API_URL" == https://* ]]; then
            ALL_URLS+=("$API_URL")
          fi
          ALL_URLS+=("${FALLBACK_URLS[@]}")

          SDK_FILE="/tmp/iphone_sdk.tar.xz"
          SDK_OK=false

          for URL in "${ALL_URLS[@]}"; do
            echo "⬇️  Trying: $URL"
            HTTP_CODE=$(curl --silent --location --output "$SDK_FILE" \
              --write-out "%{http_code}" "$URL" 2>/dev/null || echo "000")
            echo "   HTTP: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] && [ -s "$SDK_FILE" ]; then
              FILE_TYPE=$(file --brief "$SDK_FILE" 2>/dev/null || echo "unknown")
              echo "   Type: $FILE_TYPE"
              if echo "$FILE_TYPE" | grep -qiE "XZ compressed|compressed data"; then
                echo "✅ Valid SDK"
                SDK_OK=true
                break
              else
                echo "⚠️  Non-XZ file (likely a 404 HTML page)"
                rm -f "$SDK_FILE"
              fi
            else
              echo "⚠️  Failed (HTTP $HTTP_CODE or empty file)"
              rm -f "$SDK_FILE" 2>/dev/null || true
            fi
          done

          if [ "$SDK_OK" != "true" ]; then
            echo "❌ Could not download a valid iOS SDK"
            exit 1
          fi

          echo "📂 Extracting SDK..."
          tar -xJf "$SDK_FILE" -C "$THEOS/sdks/"
          rm -f "$SDK_FILE"
          echo "📋 Available SDKs:"; ls "$THEOS/sdks/"
          echo "✅ Theos + SDK ready"

      # ── Homebrew cache (ldid + make + libplist) ──
      # Avoids re-downloading/reinstalling these formulas on every run.
      # ⚠️ Fragile by nature: the cache key includes the version number
      # of the formulas themselves. If Homebrew publishes a new version
      # of ldid/make, the key changes automatically (clean cache miss,
      # no corruption) and a fresh reinstall is triggered.
      - name: 💾 Cache Homebrew (ldid, make, libplist)
        id: cache-brew
        uses: actions/cache@v5
        with:
          path: |
            /opt/homebrew/Cellar/ldid
            /opt/homebrew/Cellar/make
            /opt/homebrew/Cellar/libplist
          key: brew-ldid-make-${{ runner.os }}-v1

      - name: 🔑 Install ldid + GNU Make
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          set -euo pipefail

          if [ "${{ steps.cache-brew.outputs.cache-hit }}" = "true" ]; then
            echo "♻️  Homebrew cache restored, re-linking binaries..."
            brew link --overwrite ldid make libplist 2>/dev/null || true
          else
            echo "📦 Fresh install via Homebrew..."
            brew install ldid make
          fi

          echo "✅ ldid: $(which ldid)"

          MAKE_BIN_DIR="$(brew --prefix make)/libexec/gnubin"
          echo "GNUMAKE_BIN_DIR=$MAKE_BIN_DIR" >> $GITHUB_ENV
          echo "$MAKE_BIN_DIR" >> $GITHUB_PATH
          echo "✅ GNU Make ready: $MAKE_BIN_DIR"

          # NOTE: "lief" installation was removed from this step since
          # it wasn't used anywhere in this workflow (build-dylib.yml).
          # If it's actually needed in ANOTHER workflow (e.g. Build IPA),
          # no action needed here. If you need it here too, let me know
          # and I'll add it back wired up correctly.

      - name: 🔨 Compile the tweak
        run: |
          set -euo pipefail
          export PATH="$THEOS/bin:$PATH"

          echo "🔨 Make used: $(which make) — $(make --version | head -1)"

          SDK_NAME=$(ls "$THEOS/sdks/" | grep -E 'iPhoneOS[0-9.]+\.sdk' | sort -V | tail -1)
          if [ -z "$SDK_NAME" ]; then
            echo "❌ No SDK found in $THEOS/sdks/"; exit 1
          fi

          SDK_VER=$(echo "$SDK_NAME" | grep -oE '[0-9]+\.[0-9]+')
          echo "📱 SDK: $SDK_NAME (version $SDK_VER)"

          MAKE_EXTRA=""
          if [ "$SDK_VER" != "16.5" ]; then
            MAKE_EXTRA="TARGET=iphone:clang:${SDK_VER}:14.0"
          fi

          make -j$(sysctl -n hw.ncpu) FINALPACKAGE=1 $MAKE_EXTRA

          DYLIB_PATH=$(find .theos -name "*.dylib" 2>/dev/null | head -1)
          if [ -z "$DYLIB_PATH" ]; then
            DYLIB_PATH=$(find . -name "*.dylib" -not -path "./theos/*" 2>/dev/null | head -1)
          fi
          if [ -z "$DYLIB_PATH" ]; then
            echo "❌ No .dylib found after make"
            find . -name "*.dylib" 2>/dev/null || true
            exit 1
          fi

          echo "🔑 ldid signing: $DYLIB_PATH"
          ldid -S "$DYLIB_PATH"
          echo "✅ ldid OK"
          echo "   Arch: $(lipo -archs "$DYLIB_PATH" 2>/dev/null || file "$DYLIB_PATH")"

          echo "✅ .dylib: $DYLIB_PATH ($(du -sh "$DYLIB_PATH" | cut -f1))"
          echo "DYLIB_PATH=$DYLIB_PATH" >> $GITHUB_ENV

      - name: 📤 Save the .dylib
        uses: actions/upload-artifact@v6
        with:
          name: TwitchPlusK-v${{ github.run_number }}-dylib
          path: ${{ env.DYLIB_PATH }}
          retention-days: 7
          compression-level: 0

      - name: 📋 Prepare file for Release (fixed name)
        run: |
          set -euo pipefail
          cp "$DYLIB_PATH" /tmp/TwitchPlusK.dylib
          echo "✅ Copied to /tmp/TwitchPlusK.dylib ($(du -sh /tmp/TwitchPlusK.dylib | cut -f1))"

      - name: 🚀 Publish Dylib Release (fixed URL)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dylib-latest
          name: "Latest Dylib build (run #${{ github.run_number }})"
          files: /tmp/TwitchPlusK.dylib
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔔 Notify via Pushcut
        continue-on-error: true
        run: curl -s "${{ secrets.PUSHCUT_URL }}"

      - name: ✅ Summary
        run: |
          echo "========================================"
          echo "  Dylib built! 🎉"
          echo "========================================"
          echo "👉 Go to Actions → this run → Artifacts"
          echo "👉 Right-click 'TwitchPlusK-v${{ github.run_number }}-dylib' → Copy link"
          echo "👉 Paste this link into the 'Build IPA' workflow to inject it"
          echo ""
          echo "👉 OR use the fixed URL (always the latest build):"
          echo "   https://github.com/Knoks1111/TwitchPlusK/releases/download/dylib-latest/TwitchPlusK.dylib"
          echo "========================================"
