name: 📦 Build IPA (final)

on:
  workflow_dispatch:
    inputs:
      twitchplusk_version:
        description: "TwitchPlusK release version (for example: 1.0.1)"
        required: true
      dylib_artifact_url:
        description: "Dylib link — either an artifact link from a 'Build Dylib' run's Artifacts page, or any direct download link to a .dylib file"
        required: true
      ipa_url:
        description: 'Direct Twitch IPA link (filebin, etc.)'
        required: true
      publish_source:
        description: 'Also commit the shared AltStore/SideStore update.json to main after publishing the IPA'
        type: boolean
        default: false

concurrency:
  group: publish-ipa
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15

    steps:

      - uses: actions/checkout@v4

      - name: Validate source publication
        env:
          TPK_VERSION: ${{ inputs.twitchplusk_version }}
          PUBLISH_SOURCE: ${{ inputs.publish_source }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ['TPK_VERSION']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version) or len(version) > 40:
              raise SystemExit('Invalid TwitchPlusK version')
          if os.environ['PUBLISH_SOURCE'] == 'true':
              if os.environ['GITHUB_REF'] != 'refs/heads/main':
                  raise SystemExit('Source publication requires the main branch')
              expected = re.search(r'^TWITCHPLUSK_VERSION\s*[:?+]?=\s*(\S+)', Path('Makefile').read_text(), re.M)
              if not expected or expected[1] != version:
                  raise SystemExit('Release version must match TWITCHPLUSK_VERSION in Makefile')
          PY

      - name: 🔑 Install ldid + lief
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          set -euo pipefail

          brew install ldid
          echo "✅ ldid: $(which ldid)"

          pip3 install "lief==0.17.6" --quiet --break-system-packages
          python3 -c "import lief; print('✅ lief', lief.__version__)"

      - name: 📥 Fetch the .dylib
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RAW_URL="${{ github.event.inputs.dylib_artifact_url }}"
          echo "🔗 Provided link: $RAW_URL"

          mkdir -p dylib_extracted

          if echo "$RAW_URL" | grep -qE '/actions/runs/[0-9]+/artifacts/[0-9]+'; then
            echo "📦 GitHub Actions artifact link detected"
            ARTIFACT_ID=$(echo "$RAW_URL" | grep -oE '[0-9]+$')
            echo "🆔 Artifact ID: $ARTIFACT_ID"

            HTTP_CODE=$(curl --silent --location --output dylib_download \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip")

            echo "HTTP: $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ] || [ ! -s "dylib_download" ]; then
              echo "❌ Artifact download failed (HTTP $HTTP_CODE)"
              echo "   The artifact may have expired (retention-days) or the ID is wrong"
              exit 1
            fi
          else
            echo "🔗 Direct link detected — downloading"
            HTTP_CODE=$(curl --silent --location --output dylib_download \
              --write-out "%{http_code}" "$RAW_URL" 2>/dev/null || echo "000")

            echo "HTTP: $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ] || [ ! -s "dylib_download" ]; then
              echo "❌ Download failed (HTTP $HTTP_CODE)"
              exit 1
            fi
          fi

          FILE_TYPE=$(file --brief dylib_download)
          echo "Detected type: $FILE_TYPE"

          if echo "$FILE_TYPE" | grep -qiE "zip|archive"; then
            echo "📂 Archive detected — extracting"
            unzip -q dylib_download -d dylib_extracted
            DYLIB_PATH=$(find dylib_extracted -name "*.dylib" | head -1)
          elif echo "$FILE_TYPE" | grep -qiE "mach-o"; then
            echo "⚙️  Direct Mach-O binary detected (not an archive)"
            cp dylib_download dylib_extracted/TwitchPlusK.dylib
            DYLIB_PATH="dylib_extracted/TwitchPlusK.dylib"
          else
            echo "❌ Downloaded file not recognized (neither archive nor Mach-O)"
            exit 1
          fi

          if [ -z "$DYLIB_PATH" ]; then
            echo "❌ No .dylib found"
            ls -R dylib_extracted
            exit 1
          fi

          echo "🔑 ldid signing: $DYLIB_PATH"
          ldid -S "$DYLIB_PATH"

          echo "✅ .dylib fetched: $DYLIB_PATH ($(du -sh "$DYLIB_PATH" | cut -f1))"
          echo "DYLIB_PATH=$DYLIB_PATH" >> $GITHUB_ENV

      - name: 📲 Download the Twitch IPA
        run: |
          set -euo pipefail

          IPA_SOURCE="${{ github.event.inputs.ipa_url }}"
          if [ -z "$IPA_SOURCE" ]; then
            echo "❌ No IPA link provided"
            exit 1
          fi

          if echo "$IPA_SOURCE" | grep -q "drive.google.com"; then
            FILE_ID=$(echo "$IPA_SOURCE" | grep -oE '[-\w]{25,}' | head -1)
            echo "📎 Google Drive detected, ID: $FILE_ID"
            pip3 install gdown --quiet --break-system-packages

            gdown "https://drive.google.com/uc?id=${FILE_ID}" -O Twitch.ipa || \
            gdown --fuzzy "$IPA_SOURCE" -O Twitch.ipa || {
              echo "❌ gdown failed — Google is blocking the download"
              exit 1
            }

          else
            echo "🔗 Direct link detected"
            HTTP_CODE=$(curl --silent --location --output Twitch.ipa \
              --write-out "%{http_code}" "$IPA_SOURCE" 2>/dev/null || echo "000")
            echo "HTTP: $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ] || [ ! -s "Twitch.ipa" ]; then
              echo "❌ IPA download failed (HTTP $HTTP_CODE)"
              exit 1
            fi
          fi

          if [ ! -s "Twitch.ipa" ]; then
            echo "❌ Empty file after download"
            exit 1
          fi

          FILE_TYPE=$(file --brief Twitch.ipa)
          echo "Type: $FILE_TYPE"
          if ! echo "$FILE_TYPE" | grep -qiE "zip|archive"; then
            echo "❌ Not a valid IPA (got: $FILE_TYPE)"
            exit 1
          fi

          echo "✅ IPA: $(du -sh Twitch.ipa | cut -f1)"

      - name: 💉 Inject TwitchPlusK into the Twitch IPA
        env:
          TPK_VERSION: ${{ inputs.twitchplusk_version }}
        run: |
          set -euo pipefail
          DYLIB_PATH="${{ env.DYLIB_PATH }}"

          echo "📱 Source IPA: $(du -sh Twitch.ipa | cut -f1)"
          echo "🔧 .dylib:     $DYLIB_PATH"

          mkdir -p IPA_work
          unzip -q Twitch.ipa -d IPA_work

          APP_PATH=$(find IPA_work/Payload -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app in Payload/"
            ls IPA_work/Payload/ || true
            exit 1
          fi
          echo "📂 App: $APP_PATH"

          python3 .github/scripts/update_source.py stamp-build "$APP_PATH" "$TPK_VERSION"

          TWITCH_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" \
            "$APP_PATH/Info.plist" 2>/dev/null || echo "unknown")
          echo "📱 Detected Twitch version: $TWITCH_VERSION"
          echo "TWITCH_VERSION=$TWITCH_VERSION" >> $GITHUB_ENV

          APP_NAME=$(basename "$APP_PATH" .app)
          BINARY="$APP_PATH/$APP_NAME"

          if [ ! -f "$BINARY" ]; then
            EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" \
              "$APP_PATH/Info.plist" 2>/dev/null || true)
            [ -n "$EXEC_NAME" ] && BINARY="$APP_PATH/$EXEC_NAME"
          fi

          if [ ! -f "$BINARY" ]; then
            BINARY=$(find "$APP_PATH" -maxdepth 1 -type f \
              -exec sh -c 'file "$1" | grep -q "Mach-O" && echo "$1"' _ {} \; | head -1)
          fi

          if [ -z "$BINARY" ] || [ ! -f "$BINARY" ]; then
            echo "❌ Main binary not found in $APP_PATH"
            ls "$APP_PATH" | head -20
            exit 1
          fi
          echo "⚙️  Binary: $BINARY"

          cp "$DYLIB_PATH" "$APP_PATH/TwitchPlusK.dylib"
          echo "✅ .dylib copied"

          python3 << PYEOF
          import lief, sys

          binary_path = "$BINARY"
          dylib_ref   = "@executable_path/TwitchPlusK.dylib"

          fat = lief.MachO.parse(binary_path)
          if fat is None:
              print("❌ lief: unable to parse the Mach-O binary")
              sys.exit(1)

          modified = False
          for macho in fat:
              libs = [str(cmd.name) for cmd in macho.commands if hasattr(cmd, 'name')]
              if any(dylib_ref in lib for lib in libs):
                  print(f"⚠️  Already injected in this slice — skipping")
                  continue
              macho.add_library(dylib_ref)
              modified = True
              arch = str(macho.header.cpu_type).split('.')[-1]
              print(f"✅ Injected into {arch} slice")

          fat.write(binary_path)
          print(f"✅ Binary written: {binary_path}")
          PYEOF

          echo "🔍 Verifying with otool -L:"
          otool -L "$BINARY" | grep -E "TwitchPlusK|twitchplusk" || {
            echo "❌ TwitchPlusK.dylib missing from dependencies — injection failed"
            otool -L "$BINARY" | head -10
            exit 1
          }
          echo "✅ Injection confirmed"

          ldid -S "$APP_PATH/TwitchPlusK.dylib"
          echo "✅ ldid .dylib OK"

          ldid -S "$BINARY" 2>/dev/null && echo "✅ ldid binary OK" \
            || echo "⚠️  ldid binary non-critical — SideStore re-signs on sideload"

          cd IPA_work
          find . -name ".DS_Store" -delete 2>/dev/null || true
          find . -name "__MACOSX" -exec rm -rf {} + 2>/dev/null || true

          zip -qr ../TwitchPlusK_patched.ipa Payload \
            --exclude "*.DS_Store" \
            --exclude "__MACOSX/*"
          cd ..

          if [ ! -s "TwitchPlusK_patched.ipa" ]; then
            echo "❌ Patched IPA is empty"
            exit 1
          fi

          IPA_NAME="tpK-${{ github.event.inputs.twitchplusk_version }}-Twitch-${TWITCH_VERSION}.ipa"
          mv TwitchPlusK_patched.ipa "$IPA_NAME"
          echo "✅ Final IPA: $IPA_NAME ($(du -sh "$IPA_NAME" | cut -f1))"
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV

      - name: Prepare shared source metadata
        env:
          TPK_VERSION: ${{ inputs.twitchplusk_version }}
        run: |
          python3 .github/scripts/update_source.py generate "$IPA_NAME" "$TPK_VERSION" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --repository "$GITHUB_REPOSITORY" \
            --output prepared-update.json

      - name: 🚀 Publish the IPA to Release
        env:
          GH_TOKEN: ${{ github.token }}
          TWITCHPLUSK_VERSION: ${{ github.event.inputs.twitchplusk_version }}
        run: |
          set -euo pipefail

          if [ -z "$TWITCHPLUSK_VERSION" ]; then
            echo "❌ No TwitchPlusK version provided"
            exit 1
          fi

          TAG="twitchplusk-v${TWITCHPLUSK_VERSION}-twitch-${{ env.TWITCH_VERSION }}"
          IPA_NAME="${{ env.IPA_NAME }}"
          TWITCH_VERSION="${{ env.TWITCH_VERSION }}"
          TITLE="TwitchPlusK — v${TWITCHPLUSK_VERSION} | Twitch — ${TWITCH_VERSION}"
          CHANGELOG_URL="https://github.com/Knoks1111/TwitchPlusK/blob/main/CHANGELOG.md"

          NOTES_FILE="release_notes.md"
          cat > "$NOTES_FILE" << NOTESEOF
          ## TwitchPlusK release info
          - **TwitchPlusK release:** \`v${TWITCHPLUSK_VERSION}\`
          - **Twitch app version:** \`${TWITCH_VERSION}\`
          - **Full changelog:** [CHANGELOG.md](${CHANGELOG_URL})
          NOTESEOF

          cat >> "$NOTES_FILE" <<'SOURCEEOF'

          ## Automatic installation

          Add [this source](https://raw.githubusercontent.com/Knoks1111/TwitchPlusK/main/update.json) in AltStore Classic, SideStore or FlareStore to install TwitchPlusK and be notified when updates are available:

          ```text
          https://raw.githubusercontent.com/Knoks1111/TwitchPlusK/main/update.json
          ```
          SOURCEEOF

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "📦 Release '$TAG' already exists — updating details and uploading asset"
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"
            gh release upload "$TAG" "$IPA_NAME" \
              --repo "${{ github.repository }}" \
              --clobber
          else
            echo "🆕 Creating release '$TAG'"
            gh release create "$TAG" "$IPA_NAME" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"
          fi

          echo "✅ IPA published: https://github.com/${{ github.repository }}/releases/tag/$TAG"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Verify published IPA and finalize source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json publishedAt,isDraft,isPrerelease,assets > published-release.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('published-release.json').read_text())
          source = json.loads(Path('prepared-update.json').read_text())
          version = source['apps'][0]['versions'][0]
          asset = next((a for a in release['assets'] if a['name'] == os.environ['IPA_NAME']), None)
          if release['isDraft'] or release['isPrerelease'] or not release['publishedAt']:
              raise SystemExit('Source requires a public stable release')
          if not asset or asset['size'] != version['size'] or asset['url'] != version['downloadURL']:
              raise SystemExit('Published IPA does not match the prepared source')
          version['date'] = release['publishedAt']
          Path('prepared-update.json').write_text(json.dumps(source, indent=2) + '\n')
          if Path('prepared-update.json').stat().st_size > 16384:
              raise SystemExit('Shared source exceeds 16 KiB')
          PY

      - name: Upload prepared source
        uses: actions/upload-artifact@v4
        with:
          name: shared-update-source
          path: prepared-update.json

      - name: Publish shared source to main
        if: ${{ inputs.publish_source }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/update.json?ref=main" > remote-source.json
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          remote = json.loads(Path('remote-source.json').read_text())
          current = json.loads(base64.b64decode(remote['content']))
          data = Path('prepared-update.json').read_bytes()
          source = json.loads(data)
          number = lambda v: tuple(map(int, v.split('.')))
          if number(source['version']) < number(current['version']):
              raise SystemExit('Refusing to downgrade the shared update manifest')
          body = {'message': 'Update shared app source for TwitchPlusK ' + source['version'],
                  'content': base64.b64encode(data).decode(), 'sha': remote['sha'], 'branch': 'main'}
          Path('source-request.json').write_text(json.dumps(body))
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/update.json" --input source-request.json

      - name: ✅ Summary
        run: |
          echo "========================================"
          echo "  IPA built and published as a release! 🎉"
          echo "========================================"
          echo "TwitchPlusK version: v${{ github.event.inputs.twitchplusk_version }}"
          echo "Twitch version: ${{ env.TWITCH_VERSION }}"
          echo "Tag: ${{ env.RELEASE_TAG }}"
          echo "https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}"
          echo "========================================"
