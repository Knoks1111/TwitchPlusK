name: 🧹 Supprimer tous les artifacts

on:
  workflow_dispatch:   # lancement manuel uniquement

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: 🗑️ Supprimer TOUS les artifacts (toutes sources confondues)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔍 Recherche de tous les artifacts du repo..."
          REPO="${{ github.repository }}"

          PAGE=1
          DELETED=0
          FAILED=0

          while true; do
            ARTIFACT_IDS=$(curl --silent \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/artifacts?per_page=100&page=${PAGE}" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for a in data.get('artifacts', []):
              print(a['id'])
          ")

            if [ -z "$(echo "$ARTIFACT_IDS" | tr -d '[:space:]')" ]; then break; fi
            COUNT=$(echo "$ARTIFACT_IDS" | wc -l | tr -d ' ')

            for ARTIFACT_ID in $ARTIFACT_IDS; do
              HTTP=$(curl --silent --output /dev/null --write-out "%{http_code}" \
                --request DELETE \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/actions/artifacts/${ARTIFACT_ID}")
              if [ "$HTTP" = "204" ]; then
                DELETED=$((DELETED+1))
                echo "  ✅ Artifact supprimé: $ARTIFACT_ID"
              else
                FAILED=$((FAILED+1))
                echo "  ⚠️  Échec ($HTTP): $ARTIFACT_ID"
              fi
            done

            # Ne pas avancer de page: les artifacts supprimés décalent déjà la pagination
            [ "$COUNT" -lt 100 ] && break
          done

          echo "✅ Terminé — $DELETED artifact(s) supprimé(s), $FAILED échec(s)"

      - name: 🗑️ Nettoyer les anciens runs (workflows actifs ET supprimés)
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          echo "🔍 Récupération de TOUS les runs du repo via /actions/runs (repo-wide)..."
          echo "   → Cette méthode remonte aussi les runs des workflows dont le .yml a été supprimé."
          REPO="${{ github.repository }}"

          PAGE=1
          > /tmp/all_runs.txt

          while true; do
            LINES_BEFORE=$(wc -l < /tmp/all_runs.txt)

            curl --silent \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/runs?per_page=100&page=${PAGE}" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for r in data.get('workflow_runs', []):
              # id / workflow_id / nom (nom conservé pour les logs, workflow_id peut correspondre
              # à un workflow supprimé — c'est justement ce qu'on veut capter)
              print(f\"{r['id']}\t{r['workflow_id']}\t{r['name']}\")
          " >> /tmp/all_runs.txt

            LINES_AFTER=$(wc -l < /tmp/all_runs.txt)
            ADDED=$((LINES_AFTER - LINES_BEFORE))
            echo "  📄 Page ${PAGE}: ${ADDED} run(s) récupéré(s)"

            [ "$ADDED" -lt 100 ] && break
            PAGE=$((PAGE+1))
          done

          TOTAL=$(wc -l < /tmp/all_runs.txt)
          echo "📊 Total runs trouvés (tous workflows, actifs ou supprimés): ${TOTAL}"
          echo ""
          echo "🧮 Sélection des runs à conserver (le plus récent par workflow_id + le run en cours)..."

          export CURRENT_RUN_ID
          python3 << 'PYEOF' > /tmp/to_delete.txt
          import os

          current_run_id = os.environ["CURRENT_RUN_ID"]
          seen_workflows = set()
          to_delete = []

          with open('/tmp/all_runs.txt') as f:
              for line in f:
                  line = line.rstrip('\n')
                  if not line:
                      continue
                  run_id, workflow_id, name = line.split('\t', 2)

                  if run_id == current_run_id:
                      continue  # toujours garder le run en cours

                  if workflow_id not in seen_workflows:
                      seen_workflows.add(workflow_id)
                      continue  # garder le run le plus récent de ce workflow_id

                  to_delete.append(run_id)

          for rid in to_delete:
              print(rid)
          PYEOF

          TO_DELETE_COUNT=$(wc -l < /tmp/to_delete.txt | tr -d ' ')
          echo "🗑️  ${TO_DELETE_COUNT} run(s) à supprimer"
          echo ""

          DELETED=0
          FAILED=0

          while IFS= read -r RUN_ID; do
            [ -z "$RUN_ID" ] && continue
            HTTP=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --request DELETE \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}")
            if [ "$HTTP" = "204" ]; then
              DELETED=$((DELETED+1))
              echo "  ✅ Run supprimé: $RUN_ID"
            else
              FAILED=$((FAILED+1))
              echo "  ⚠️  Échec ($HTTP): $RUN_ID"
            fi
          done < /tmp/to_delete.txt

          echo "──────────────────────────────────────"
          echo "✅ Nettoyage des runs terminé — $DELETED supprimé(s), $FAILED échec(s)"
